name: Analisis programado

on:
  schedule:
    # Lunes 07:00 UTC (04:00 Argentina)
    - cron: "0 7 * * 1"
    # Jueves 07:00 UTC (04:00 Argentina)
    - cron: "0 7 * * 4"
  # Permite correrlo manualmente desde GitHub Actions
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar secret
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_OAUTH_TOKEN" ]; then
            echo "SECRET VACIO O NO CONFIGURADO"
            exit 1
          else
            echo "Secret OK (longitud: ${#ANTHROPIC_OAUTH_TOKEN})"
          fi

      - name: Generar reporte
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          STACK_EXCHANGE_KEY: ${{ secrets.STACK_EXCHANGE_KEY }}
        run: python generate_report.py

      - name: Commit y push del reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "reporte automatico $(date -u '+%Y-%m-%d')"
          git push
